name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile search helper
        run: python -m py_compile scripts/search_kb.py

      - name: Show helper usage
        run: python scripts/search_kb.py --help

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

